<svg xmlns="http://www.w3.org/2000/svg" width="840" height="186" viewBox="0 0 840 186" fill="none">
<style>@font-face{font-family:'GM5';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:500}
@font-face{font-family:'G4';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:400}
@font-face{font-family:'IS';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:400}
@font-face{font-family:'ISI';src:url(data:font/woff2;base64,) format('woff2');font-style:italic;font-weight:400}
.mono-m{font-family:'GM5','SF Mono',Menlo,Consolas,monospace;font-style:normal;font-weight:500}
.sans{font-family:'G4',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-style:normal;font-weight:400}
.serif{font-family:'IS',Georgia,'Times New Roman',serif;font-style:normal;font-weight:400}
.serif-i{font-family:'ISI',Georgia,'Times New Roman',serif;font-style:italic;font-weight:400}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.fade{animation:fade 1.1s ease both}
@keyframes fade{from{opacity:0}}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.4s cubic-bezier(.65,0,.35,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.draw{stroke-dasharray:1 1;animation:draw 1.6s cubic-bezier(.65,0,.35,1) both}
@keyframes draw{from{stroke-dashoffset:1}}
.pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 2.4s cubic-bezier(.2,.6,.4,1) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(3.4);opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.nudge{animation:nudge 3s ease-in-out infinite}
@keyframes nudge{0%,50%,100%{transform:translate(0,0)}25%{transform:translate(2px,-2px)}}
.roll{animation:roll 1.8s cubic-bezier(.16,1,.3,1) both}
@keyframes roll{from{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<g class="rise">
<text x="0" y="20" class="mono-m" font-size="11" letter-spacing="1.6" fill="#C2410C">05</text>
<text x="26.4" y="20" class="mono-m" font-size="11" letter-spacing="1.6" fill="#78736D">CONTACT</text>
</g>
<rect x="99.8" y="16" width="740.2" height="1" fill="#000000" fill-opacity="0.07" class="grow" style="animation-delay:0.15s"/>
<g class="rise" style="animation-delay:0.1s">
<text y="104"><tspan x="-2" class="serif" font-size="54" fill="#1A1918">Let&#8217;s build something</tspan><tspan x="397.11" class="serif-i" font-size="54" fill="#E8571F">worth using.</tspan></text>
</g>
<g class="rise" style="animation-delay:0.25s">
<text x="0" y="146" class="sans" font-size="17" fill="#57534E">Open to collaborations, interesting problems and good conversations.</text>
</g>
</svg>
