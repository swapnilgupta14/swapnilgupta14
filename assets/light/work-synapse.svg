<svg xmlns="http://www.w3.org/2000/svg" width="420" height="226" viewBox="0 0 420 226" fill="none">
<style>@font-face{font-family:'GM4';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:400}
@font-face{font-family:'GM5';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:500}
@font-face{font-family:'G4';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:400}
@font-face{font-family:'IS';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:400}
.mono{font-family:'GM4','SF Mono',Menlo,Consolas,monospace;font-style:normal;font-weight:400}
.mono-m{font-family:'GM5','SF Mono',Menlo,Consolas,monospace;font-style:normal;font-weight:500}
.sans{font-family:'G4',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-style:normal;font-weight:400}
.serif{font-family:'IS',Georgia,'Times New Roman',serif;font-style:normal;font-weight:400}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.fade{animation:fade 1.1s ease both}
@keyframes fade{from{opacity:0}}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.4s cubic-bezier(.65,0,.35,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.draw{stroke-dasharray:1 1;animation:draw 1.6s cubic-bezier(.65,0,.35,1) both}
@keyframes draw{from{stroke-dashoffset:1}}
.pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 2.4s cubic-bezier(.2,.6,.4,1) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(3.4);opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.nudge{animation:nudge 3s ease-in-out infinite}
@keyframes nudge{0%,50%,100%{transform:translate(0,0)}25%{transform:translate(2px,-2px)}}
.roll{animation:roll 1.8s cubic-bezier(.16,1,.3,1) both}
@keyframes roll{from{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<g class="fade">
<rect x="0.5" y=".5" width="411" height="225" rx="16" fill="#000000" fill-opacity="0.018" stroke="#000000" stroke-opacity="0.13"/>
</g>
<g transform="translate(24 22)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 31L21 22" pathLength="1" stroke="#57534E" class="draw" style="animation-delay:0.25s"/><path d="M20 6L21 22" pathLength="1" stroke="#57534E" class="draw" style="animation-delay:0.37s"/><path d="M35 29L21 22" pathLength="1" stroke="#57534E" class="draw" style="animation-delay:0.49s"/><path d="M5 31L20 6" pathLength="1" stroke="#57534E" class="draw" style="animation-delay:0.25s"/><circle cx="5" cy="31" r="3.4" stroke="#57534E" fill="#57534E" fill-opacity="0"/><circle cx="20" cy="6" r="3.4" stroke="#57534E" fill="#57534E" fill-opacity="0"/><circle cx="35" cy="29" r="3.4" stroke="#57534E" fill="#57534E" fill-opacity="0"/><circle cx="21" cy="22" r="3.4" fill="#E8571F" class="pulse"/><circle cx="21" cy="22" r="3.4" fill="#E8571F"/></g>
<circle cx="374" cy="38" r="14" stroke="#000000" stroke-opacity="0.13"/><g class="nudge"><path d="M370 42L378 34M371.5 34H378V40.5" stroke="#C2410C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="rise" style="animation-delay:0.15s">
<text x="24" y="106" class="serif" font-size="36" letter-spacing="-0.2" fill="#1A1918">Synapse</text>
</g>
<g class="rise" style="animation-delay:0.25s">
<text y="134"><tspan x="24" class="sans" font-size="14.5" fill="#57534E">An enterprise workflow suite for projects, teams, task</tspan></text>
<text y="155"><tspan x="24" class="sans" font-size="14.5" fill="#57534E">allocation and progress tracking.</tspan></text>
</g>
<rect x="24" y="178" width="364" height="1" fill="#000000" fill-opacity="0.07"/>
<g class="rise" style="animation-delay:0.35s">
<text x="24" y="203" class="mono-m" font-size="10" letter-spacing="1.4" fill="#78736D">TYPESCRIPT &#183; SAAS</text>
<text x="245.2" y="203" class="mono" font-size="10.5" letter-spacing="0.2" fill="#57534E">org-synapse.vercel.app</text>
</g>
</svg>
