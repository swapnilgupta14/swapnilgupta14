<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="216" height="64" viewBox="0 0 216 64" fill="none">
<style>.point{animation:point 2.6s ease-in-out 3s infinite}@keyframes point{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.fade{animation:fade 1.1s ease both}
@keyframes fade{from{opacity:0}}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.4s cubic-bezier(.65,0,.35,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.draw{stroke-dasharray:1 1;animation:draw 1.6s cubic-bezier(.65,0,.35,1) both}
@keyframes draw{from{stroke-dashoffset:1}}
.pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 2.4s cubic-bezier(.2,.6,.4,1) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(3.4);opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.nudge{animation:nudge 3s ease-in-out infinite}
@keyframes nudge{0%,50%,100%{transform:translate(0,0)}25%{transform:translate(2px,-2px)}}
.roll{animation:roll 1.8s cubic-bezier(.16,1,.3,1) both}
@keyframes roll{from{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<g class="point"><path d="M182 15.5C162 5 122 8 116 23C111 35 134 39.5 136 29C138 17 100 18.5 76 29C56 37.25 34 41 12 38.75" pathLength="1" stroke="#FF7A45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:.9s"/><path d="M23 31L12 39L24 46" pathLength="1" stroke="#FF7A45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:2.2s;animation-duration:.5s"/></g>
</svg>
