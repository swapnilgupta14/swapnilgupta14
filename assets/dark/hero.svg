<svg xmlns="http://www.w3.org/2000/svg" width="840" height="344" viewBox="0 0 840 344" fill="none">
<style>@font-face{font-family:'GM5';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:500}
@font-face{font-family:'G4';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:400}
@font-face{font-family:'IS';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:400}
@font-face{font-family:'ISI';src:url(data:font/woff2;base64,) format('woff2');font-style:italic;font-weight:400}
.mono-m{font-family:'GM5','SF Mono',Menlo,Consolas,monospace;font-style:normal;font-weight:500}
.sans{font-family:'G4',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-style:normal;font-weight:400}
.serif{font-family:'IS',Georgia,'Times New Roman',serif;font-style:normal;font-weight:400}
.serif-i{font-family:'ISI',Georgia,'Times New Roman',serif;font-style:italic;font-weight:400}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.fade{animation:fade 1.1s ease both}
@keyframes fade{from{opacity:0}}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.4s cubic-bezier(.65,0,.35,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.draw{stroke-dasharray:1 1;animation:draw 1.6s cubic-bezier(.65,0,.35,1) both}
@keyframes draw{from{stroke-dashoffset:1}}
.pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 2.4s cubic-bezier(.2,.6,.4,1) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(3.4);opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.nudge{animation:nudge 3s ease-in-out infinite}
@keyframes nudge{0%,50%,100%{transform:translate(0,0)}25%{transform:translate(2px,-2px)}}
.roll{animation:roll 1.8s cubic-bezier(.16,1,.3,1) both}
@keyframes roll{from{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<g class="rise">
<text x="0" y="22" class="mono-m" font-size="11" letter-spacing="1.8" fill="#85827C">SWAPNILGUPTA.IN</text>
<text x="130" y="22" class="sans" font-size="12" fill="#FF7A45">&#8599;</text>
<text x="673.8" y="22" class="mono-m" font-size="11" letter-spacing="1.8" fill="#A8A49F">CURRENTLY AT SIMPPLR</text>
<circle cx="660" cy="18" r="3.5" fill="#FF7A45" class="pulse"/>
<circle cx="660" cy="18" r="3.5" fill="#FF7A45"/>
</g>
<rect x="0" y="42" width="840" height="1" fill="#FFFFFF" fill-opacity="0.13" class="grow" style="animation-delay:0.1s"/>
<g class="rise" style="animation-delay:0.12s">
<text x="-4" y="150" class="serif" font-size="104" letter-spacing="-1" fill="#EDEBE8">Swapnil Gupta</text>
</g>
<g class="rise" style="animation-delay:0.28s">
<text y="200"><tspan x="0" class="sans" font-size="21" fill="#A8A49F">Software engineer building web &#38; mobile products</tspan></text>
</g>
<g class="rise" style="animation-delay:0.38s">
<text y="233"><tspan x="0" class="sans" font-size="21" fill="#A8A49F">with an eye for the details that make them</tspan><tspan x="410.24" class="serif-i" font-size="24.5" fill="#FF7A45">feel right.</tspan></text>
</g>
<path d="M410.24 241 Q448.8 245 491.36 239.5" pathLength="1" stroke="#FF7A45" stroke-width="1.6" stroke-linecap="round" class="draw" style="animation-delay:1s"/>
<rect x="0" y="274" width="840" height="1" fill="#FFFFFF" fill-opacity="0.13" class="grow" style="animation-delay:0.35s"/>
<g class="rise" style="animation-delay:0.5s">
<text x="0" y="304" class="mono-m" font-size="10.5" letter-spacing="1.6" fill="#85827C">ROLE</text>
<text x="0" y="330" class="sans" font-size="16" fill="#EDEBE8">Software Engineer</text>
</g>
<g class="rise" style="animation-delay:0.58s">
<text x="214" y="304" class="mono-m" font-size="10.5" letter-spacing="1.6" fill="#85827C">FOCUS</text>
<text x="214" y="330" class="sans" font-size="16" fill="#EDEBE8">Frontend &#38; product UI</text>
</g>
<g class="rise" style="animation-delay:0.66s">
<text x="428" y="304" class="mono-m" font-size="10.5" letter-spacing="1.6" fill="#85827C">PLATFORMS</text>
<text x="428" y="330" class="sans" font-size="16" fill="#EDEBE8">Web, iOS &#38; Android</text>
</g>
<g class="rise" style="animation-delay:0.74s">
<text x="642" y="304" class="mono-m" font-size="10.5" letter-spacing="1.6" fill="#85827C">BASED</text>
<text x="642" y="330" class="sans" font-size="16" fill="#EDEBE8">Earth-616</text>
</g>
</svg>
