<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" fill="none">
<style>@font-face{font-family:'GM5';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:500}
@font-face{font-family:'G4';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:400}
.mono-m{font-family:'GM5','SF Mono',Menlo,Consolas,monospace;font-style:normal;font-weight:500}
.sans{font-family:'G4',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-style:normal;font-weight:400}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.fade{animation:fade 1.1s ease both}
@keyframes fade{from{opacity:0}}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.4s cubic-bezier(.65,0,.35,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.draw{stroke-dasharray:1 1;animation:draw 1.6s cubic-bezier(.65,0,.35,1) both}
@keyframes draw{from{stroke-dashoffset:1}}
.pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 2.4s cubic-bezier(.2,.6,.4,1) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(3.4);opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.nudge{animation:nudge 3s ease-in-out infinite}
@keyframes nudge{0%,50%,100%{transform:translate(0,0)}25%{transform:translate(2px,-2px)}}
.roll{animation:roll 1.8s cubic-bezier(.16,1,.3,1) both}
@keyframes roll{from{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<g class="rise">
<text x="0" y="20" class="mono-m" font-size="11" letter-spacing="1.6" fill="#FF7A45">01</text>
<text x="26.4" y="20" class="mono-m" font-size="11" letter-spacing="1.6" fill="#85827C">ABOUT</text>
</g>
<rect x="83.4" y="16" width="756.6" height="1" fill="#FFFFFF" fill-opacity="0.07" class="grow" style="animation-delay:0.15s"/>
<g class="rise" style="animation-delay:0.1s">
<text y="76"><tspan x="0" class="sans" font-size="19" fill="#A8A49F">I&#8217;m a software engineer who lives where</tspan><tspan x="352.22" class="sans" font-size="19" fill="#EDEBE8">engineering</tspan></text>
</g>
<g class="rise" style="animation-delay:0.16s">
<text y="107"><tspan x="0" class="sans" font-size="19" fill="#EDEBE8">meets design</tspan><tspan x="116.81" class="sans" font-size="19" fill="#A8A49F">. I build product interfaces for the web</tspan></text>
</g>
<g class="rise" style="animation-delay:0.22s">
<text y="138"><tspan x="0" class="sans" font-size="19" fill="#A8A49F">and mobile, and care most about</tspan><tspan x="287.45" class="sans" font-size="19" fill="#EDEBE8">the parts you feel</tspan></text>
</g>
<g class="rise" style="animation-delay:0.28s">
<text y="169"><tspan x="0" class="sans" font-size="19" fill="#EDEBE8">before you notice</tspan><tspan x="154.81" class="sans" font-size="19" fill="#A8A49F">&#8212; speed, motion and the states</tspan></text>
</g>
<g class="rise" style="animation-delay:0.34s">
<text y="200"><tspan x="0" class="sans" font-size="19" fill="#A8A49F">nobody screenshots.</tspan></text>
</g>
<g class="rise" style="animation-delay:0.43s">
<text y="245"><tspan x="0" class="sans" font-size="19" fill="#A8A49F">Days: product engineering at</tspan><tspan x="254.01" class="sans" font-size="19" fill="#EDEBE8">Simpplr</tspan><tspan x="321.95" class="sans" font-size="19" fill="#A8A49F">. Nights: UI kits,</tspan></text>
</g>
<g class="rise" style="animation-delay:0.49s">
<text y="276"><tspan x="0" class="sans" font-size="19" fill="#A8A49F">side projects and small experiments.</tspan></text>
</g>
<g class="rise" style="animation-delay:0.2s">
<text x="520" y="70" class="mono-m" font-size="10.5" letter-spacing="1.6" fill="#85827C">NOW</text>
<circle cx="551.7" cy="66.5" r="3" fill="#FF7A45" class="pulse"/>
<circle cx="551.7" cy="66.5" r="3" fill="#FF7A45"/>
<text x="520" y="94" class="sans" font-size="16" fill="#EDEBE8">Product engineering at Simpplr</text>
</g>
<rect x="520" y="110" width="320" height="1" fill="#FFFFFF" fill-opacity="0.07" class="grow" style="animation-delay:0.3s"/>
<g class="rise" style="animation-delay:0.29s">
<text x="520" y="128" class="mono-m" font-size="10.5" letter-spacing="1.6" fill="#85827C">BUILDING</text>
<text x="520" y="152" class="sans" font-size="16" fill="#EDEBE8">Blueberry UI, a React component kit</text>
</g>
<rect x="520" y="168" width="320" height="1" fill="#FFFFFF" fill-opacity="0.07" class="grow" style="animation-delay:0.39s"/>
<g class="rise" style="animation-delay:0.38s">
<text x="520" y="186" class="mono-m" font-size="10.5" letter-spacing="1.6" fill="#85827C">EXPLORING</text>
<text x="520" y="210" class="sans" font-size="16" fill="#EDEBE8">React Native, Expo &#38; Web3</text>
</g>
<rect x="520" y="226" width="320" height="1" fill="#FFFFFF" fill-opacity="0.07" class="grow" style="animation-delay:0.48s"/>
<g class="rise" style="animation-delay:0.47s">
<text x="520" y="244" class="mono-m" font-size="10.5" letter-spacing="1.6" fill="#85827C">OBSESSING OVER</text>
<text x="520" y="268" class="sans" font-size="16" fill="#EDEBE8">Web performance &#38; motion</text>
</g>
</svg>
