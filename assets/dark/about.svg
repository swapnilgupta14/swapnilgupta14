<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="152" viewBox="0 0 840 152" fill="none">
<style>@font-face{font-family:'GM5';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:500}
@font-face{font-family:'G4';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:400}
@font-face{font-family:'G5';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:500}
.mono-m{font-family:'GM5','SF Mono',Menlo,Consolas,monospace;font-style:normal;font-weight:500}
.sans{font-family:'G4',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-style:normal;font-weight:400}
.sans-m{font-family:'G5',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-style:normal;font-weight:500}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.fade{animation:fade 1.1s ease both}
@keyframes fade{from{opacity:0}}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.4s cubic-bezier(.65,0,.35,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.draw{stroke-dasharray:1 1;animation:draw 1.6s cubic-bezier(.65,0,.35,1) both}
@keyframes draw{from{stroke-dashoffset:1}}
.pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 2.4s cubic-bezier(.2,.6,.4,1) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(3.4);opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.nudge{animation:nudge 3s ease-in-out infinite}
@keyframes nudge{0%,50%,100%{transform:translate(0,0)}25%{transform:translate(2px,-2px)}}
.roll{animation:roll 1.8s cubic-bezier(.16,1,.3,1) both}
@keyframes roll{from{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<g class="rise">
<text x="0" y="22" class="mono-m" font-size="14" letter-spacing="0.5" fill="#FF7A45">01</text>
<text x="27.8" y="22" class="sans-m" font-size="16" letter-spacing="-0.1" fill="#EDEBE8">About</text>
</g>
<rect x="88.31" y="17" width="751.69" height="1" fill="#FFFFFF" fill-opacity="0.07" class="grow" style="animation-delay:0.15s"/>
<g class="rise" style="animation-delay:0.1s">
<text y="70"><tspan x="0" class="sans" font-size="14" fill="#A8A49F">I work across the whole stack &#8212;</tspan><tspan x="210.73" class="sans" font-size="14" fill="#FF7A45">models, APIs and interfaces</tspan><tspan x="390.96" class="sans" font-size="14" fill="#A8A49F">&#8212; mostly in TypeScript</tspan></text>
</g>
<g class="rise" style="animation-delay:0.17s">
<text y="94"><tspan x="0" class="sans" font-size="14" fill="#A8A49F">and Python, for the web and mobile.</tspan></text>
</g>
<g class="rise" style="animation-delay:0.28s">
<text y="130"><tspan x="0" class="sans" font-size="14" fill="#A8A49F">Outside the day job I&#8217;m usually deep in</tspan><tspan x="249.28" class="sans" font-size="14" fill="#FF7A45">what&#8217;s next</tspan><tspan x="322.78" class="sans" font-size="14" fill="#A8A49F">: LLM agents, RAG and Web3.</tspan></text>
</g>
</svg>
